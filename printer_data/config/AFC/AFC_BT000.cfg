[include mcu/AFC_Lite.cfg]

[mcu BT582]
canbus_uuid: 5e2f7706968e
#serial: <replace with your /dev/serial/by-id/...> and comment out canbus_uuid above

[AFC_BoxTurtle BT582]
type: 'Box Turtle'
hub: BT582
extruder: extruder
enable_buffer_tool_check: True

[temperature_sensor BT582]
sensor_type: temperature_mcu
sensor_mcu: BT582

[AFC_stepper lane1]
unit: BT582:1
buffer: HUBBY
step_pin: BT582:M1_STEP
dir_pin: BT582:M1_DIR
enable_pin: !BT582:M1_EN
microsteps: 16
rotation_distance: 54.5640483 #SMOLv2
gear_ratio: 44:10, 37:17 #SMOLv2
dist_hub: 113.42 
park_dist: 50
led_index: AFC_Indicator:1
afc_motor_rwd: BT582:MOT1_RWD
afc_motor_fwd: BT582:MOT1_FWD
afc_motor_enb: BT582:MOT1_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
prep: ^!BT582:TRG1
load: ^BT582:EXT1

[tmc2209 AFC_stepper lane1]
uart_pin: BT582:M1_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane2]
unit: BT582:2
buffer: HUBBY
step_pin: BT582:M2_STEP
dir_pin: !BT582:M2_DIR
enable_pin: !BT582:M2_EN
microsteps: 16
rotation_distance: 7.16
dist_hub: 99.93 
park_dist: 50
led_index: AFC_Indicator:2
afc_motor_rwd: BT582:MOT2_RWD
afc_motor_fwd: BT582:MOT2_FWD
afc_motor_enb: BT582:MOT2_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
prep: ^!BT582:TRG2
load: ^BT582:EXT2

[tmc2209 AFC_stepper lane2]
uart_pin: BT582:M2_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane3]
unit: BT582:3
buffer: HUBBY
step_pin: BT582:M3_STEP
dir_pin: !BT582:M3_DIR
enable_pin: !BT582:M3_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 98.45 
park_dist: 50
led_index: AFC_Indicator:3
afc_motor_rwd: BT582:MOT3_RWD
afc_motor_fwd: BT582:MOT3_FWD
afc_motor_enb: BT582:MOT3_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
prep: ^!BT582:TRG3
load: ^BT582:EXT3

[tmc2209 AFC_stepper lane3]
uart_pin: BT582:M3_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane4]
unit: BT582:4
buffer: HUBBY
step_pin: BT582:M4_STEP
dir_pin: !BT582:M4_DIR
enable_pin: !BT582:M4_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 160.01 
park_dist: 50
led_index: AFC_Indicator:4
afc_motor_rwd: BT582:MOT4_RWD
afc_motor_fwd: BT582:MOT4_FWD
afc_motor_enb: BT582:MOT4_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
prep: ^!BT582:TRG4
load: ^BT582:EXT4

[tmc2209 AFC_stepper lane4]
uart_pin: BT582:M4_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_hub BT582]
switch_pin: ^BT582:HUB   # Pin for the hub switch
afc_bowden_length: 1070.72  # Length of the Bowden tube from the hub to the toolhead sensor in mm.
cut: False                  # Hub cutter installed (e.g. Snappy)

#--=================================================================================--#
######### Hub Cut #####################################################################
#--=================================================================================--#
assisted_retract: False     # If True, retracts are assisted to prevent loose windows on the spool
cut_cmd: AFC #CMD to use
cut_dist: 50                # How much filament to cut off (in mm).
cut_clear: 120              # How far the filament should retract back from the hub (in mm).
cut_min_length: 300.0
cut_servo_pass_angle: 10    # Servo angle to align the Bowden tube with the hole for loading the toolhead.
cut_servo_clip_angle: 180   # Servo angle for cutting the filament.
cut_servo_prep_angle: 80    # Servo angle to prepare the filament for cutting (aligning the exit hole).

#[AFC_screen BT582]
#mac_address: None

[AFC_led AFC_Indicator]
pin: BT582:RGB1
chain_count: 4
color_order: GRBW

