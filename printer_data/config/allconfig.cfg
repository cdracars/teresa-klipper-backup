[gcode_macro GOOSE_BELT_MOVE]  # goose_purge_core.cfg, goose_purge_core.cfg, goose_purge_core.cfg, goose_purge_core.cfg, goose_purge_core.cfg, goose_purge_core.cfg
description:
    >
    Spin the belt to either clear it from debris, or test the movement functionality and direction.
    For DC motor spins the belt for set time and PWM.
    For stepper resets internal position, moves the requested length at the requested speed,
    and disables the stepper when finished.
gcode:
    {% set user_vars = printer['gcode_macro _GOOSE_PURGE_VARIABLES'] %}
    {% set def_vars = printer['gcode_macro _GOOSE_PURGE_VARIABLES_DEFAULT'] %}
    {% set purger_type = user_vars.purger_type | default(def_vars.purger_type) %}
    {% if purger_type == 1 %}
    {% set move_tme = params.TIME|default(5)|int %}
    {% set move_pwm = params.PWM|default(0.5)|float %}


    SET_PIN PIN=goose_belt VALUE={move_pwm}


    G4 P{move_tme}


    SET_PIN PIN=goose_belt VALUE=0


    M400
    M118 🪿 Belt moved for {move_tme} s at {move_pwm * 100} % duty cycle.

    {% elif purger_type == 2 or purger_type == 20 or purger_type == 21 %}
    {% set move_len = params.LENGTH|default(50)|int %}
    {% set move_spd = params.SPEED|default(50)|int %}



    MANUAL_STEPPER STEPPER=goose_belt SET_POSITION=0




    MANUAL_STEPPER STEPPER=goose_belt MOVE={move_len} SPEED={move_spd}


    MANUAL_STEPPER STEPPER=goose_belt ENABLE=0


    M400
    M118 🪿 Belt moved {move_len} mm at {move_spd} mm/s, stepper disabled
    {% endif %}

