    {% if roundup and length_remaining < extrusion_min %}
    {% set stepper_move_final = (belt_speed*((extrusion_min/(extrusion_fr))+(final_retraction/(final_retraction_fr)))) %}
    {% elif roundup %}
    {% set stepper_move_final = (belt_speed*((extrusion_segment/(extrusion_fr))+(final_retraction/(final_retraction_fr)))) %}
    {% else %}
    {% set stepper_move_final = (belt_speed*((length_remaining/(extrusion_fr))+(final_retraction/(final_retraction_fr)))) %}
    {% endif %}
    MANUAL_STEPPER STEPPER=goose_belt SET_POSITION=0
    MANUAL_STEPPER STEPPER=goose_belt MOVE={stepper_move_final} SPEED={belt_speed} SYNC=0
    {% endif %}

    {% if purger_type == 21 %}
    {% if roundup and length_remaining < extrusion_min %}
    MANUAL_STEPPER STEPPER=goose_belt MOVE={extrusion_min * belt_speed} SPEED={extrusion_fr * belt_speed} sync=0
    {% elif roundup %}
