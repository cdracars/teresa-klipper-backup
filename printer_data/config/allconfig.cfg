[gcode_macro PRINT_START]  # macros.cfg, macros.cfg, macros.cfg, macros.cfg, macros.cfg, macros.cfg
gcode:
    {% set target_bed = params.BED|int %}
    {% set target_extruder = params.EXTRUDER|int %}
    {% set target_chamber = params.CHAMBER|default("45")|int %}
    {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

    SET_GCODE_OFFSET Z=0


    RESPOND MSG="PRINT_START: Homing printer..."

    G28
    G90





    {% if params.BED|int > 90 %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
    RESPOND MSG="PRINT_START: Bed {target_bed}°C - Starting heatsoak"

    M106 S255




    G1 X{x_wait} Y{y_wait} Z15 F9000
    M190 S{target_bed}
    SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber}c"
    RESPOND MSG="PRINT_START: Waiting for chamber {target_chamber}°C"
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}


    {% else %}




    M190 S{target_bed}



    {% endif %}


    SET_DISPLAY_TEXT MSG="Hotend: 150c"
    RESPOND MSG="PRINT_START: Heating hotend to 150°C for leveling..."
    M109 S150








    SET_DISPLAY_TEXT MSG="Leveling"
    RESPOND MSG="PRINT_START: Running Quad Gantry Level..."

    QUAD_GANTRY_LEVEL
    RESPOND MSG="PRINT_START: Homing Z axis..."
    G28 Z


    SET_DISPLAY_TEXT MSG="Bed mesh"
    RESPOND MSG="PRINT_START: Calibrating bed mesh..."

    BED_MESH_CALIBRATE

    RESPOND MSG="PRINT_START: Cartographer touch calibration..."
    CARTOGRAPHER_TOUCH_HOME


    SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"
    RESPOND MSG="PRINT_START: Heating hotend to {target_extruder}°C..."

    G1 X{x_wait} Y{y_wait} Z15 F9000
    M107
    M109 S{target_extruder}


    SET_DISPLAY_TEXT MSG="Printer goes brr"
    RESPOND MSG="PRINT_START: Running prime line..."

    G0 X{x_wait - 50} Y4 F10000
    G0 Z0.4
    G91
    G1 X100 E20 F1000
    G90
    RESPOND MSG="PRINT_START: Ready to print!"

[gcode_macro PRINT_END]  # macros.cfg, macros.cfg, macros.cfg, macros.cfg, macros.cfg, macros.cfg
gcode:
    M400
    G92 E0
    G1 E-4.0 F3600
    G91


    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}


    {% if printer.toolhead.position.x < (max_x - 20) %}
    {% set x_safe = 20.0 %}
    {% else %}
    {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
    {% set y_safe = 20.0 %}
    {% else %}
    {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 2) %}
    {% set z_safe = 2.0 %}
    {% else %}
    {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    G0 Z{z_safe} F3600
    G0 X{x_safe} Y{y_safe} F20000
    TURN_OFF_HEATERS
    M107
    G90
    G0 X60 Y{max_y} F3600

