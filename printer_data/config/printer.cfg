[include mainsail.cfg]
[include h36_combo_can.cfg]
#[include 8_Track/*.cfg]
[include macros.cfg]
# [include led.cfg]
# [include print_area_bed_mesh.cfg]
[include shaketune.cfg]
[include scanner.cfg]
[exclude_object]
[include AFC/*.cfg]
[include goose_purge.cfg]

[allconfig]
# # Here just to call allconfig

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_170010000350534E4E313020-if00

[mcu RaspBerry]
serial: /tmp/klipper_host_mcu

[virtual_sdcard]
path: /home/longshot/printer_data/gcodes

[printer]
kinematics: corexy
max_velocity: 1000  
max_accel: 10000    			
max_z_velocity: 150			#Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 5000
square_corner_velocity: 5.0
max_accel: 20000  # should not exceed the estimated max_accel for X and Y axes

[temperature_fan MCU]
pin: PA8
sensor_type: temperature_mcu
sensor_mcu: mcu
control: watermark
min_temp: 10
max_temp: 80
target_temp: 40

[temperature_fan RaspBerry]
pin: PE5
sensor_type: temperature_host
#sensor_mcu: host
control: watermark
min_temp: 10
max_temp: 80
target_temp: 60


#####################################################################
# 	X/Y Stepper Settings
#####################################################################

## X Stepper on MOTOR0(B Motor)
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG6
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 75   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: True
run_current: 1.2
hold_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0

## Y Stepper on MOTOR1 (A Motor)
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG9
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 75  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: True
run_current: 1.2
hold_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0
 
#####################################################################
# 	Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left on MOTOR2_1
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop # uses cartographer as virtual endstop
# endstop_pin:PB6 # dummy value for clog clear
# position_endstop: 0 # dummy value for clog clear
homing_retract_dist: 0  # Must be 0 for Cartographer
position_max: 340
position_min: -5
homing_speed: 10
second_homing_speed: 3

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z1 Stepper - Rear Left on MOTOR3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z2 Stepper - Rear Right on MOTOR4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: true
run_current: 0.8
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z3 Stepper - Front Right on MOTOR5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: true
run_current: 0.8
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

