[mcu cartographer] # See https://www.klipper3d.org/Config_Reference.html#mcu
is_non_critical: True
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_3E0056000650303448383620-if00
restart_method: command
#canbus_uuid: 27bd3de09896 
#canbus_interface: can0


[cartographer]
mcu: cartographer
x_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 21.1 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: no # For extra output

[cartographer touch]
retract_distance: 5

# [bed_mesh]
# zero_reference_position: 175, 175 # The centre of your bed. 
# speed: 500
# horizontal_move_z: 5
# mesh_min: 35, 6 # The first probed coordinate, nearest to the origin. This coordinate is relative to the probe's location.
# mesh_max: 240, 198 # The probed coordinate farthest from the origin. This is not necessarily the last point probed, as the probing process occurs in a zig-zag fashion. As with mesh_min, this coordinate is relative to the probe's location.
# probe_count: 30, 30
# adaptive_margin: 10
# mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough
# algorithm: bicubic

[temperature_sensor cartographer_mcu]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[adxl345]
# Select 1 of the cs_pin below depending on the probe you have. 
# Having the wrong one selected will cause an Endless Bootloop
# Cartographer V4 has int2 connected to the probes PA1 pin
# cs_pin: cartographer:PA3 # For Cartographer V3
cs_pin: cartographer:PA0 # For Cartographer V4
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    125, 125, 20 # Fill out the blank with x and y coordinates where you want to run the resonance test.

[gcode_macro _PARK]
gcode:
    G1 X175 Y175 Z15 F9000
    M107